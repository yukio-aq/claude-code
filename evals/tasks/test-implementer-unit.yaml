name: test-implementer-unit
agent: test-implementer
description: 純粋関数のユニットテストを正常系・異常系・境界値を揃えて実装できるか

setup:
  - path: "{tmpdir}/src/utils/password.ts"
    content: |
      export function validatePassword(password: string): { valid: boolean; errors: string[] } {
        const errors: string[] = []
        if (password.length < 8) errors.push('8文字以上で入力してください')
        if (!/[A-Z]/.test(password)) errors.push('大文字を含めてください')
        if (!/[0-9]/.test(password)) errors.push('数字を含めてください')
        return { valid: errors.length === 0, errors }
      }
  - path: "{tmpdir}/package.json"
    content: |
      { "name": "eval-test", "type": "module" }

working_dir: "{tmpdir}"

prompt: |
  src/utils/password.ts の validatePassword のユニットテストを
  src/utils/password.test.ts に実装してください。
  正常系・異常系・境界値（8文字ちょうど）をカバーしてください。

judge:
  - type: file_exists
    description: password.test.ts が作成されている
    path: "{tmpdir}/src/utils/password.test.ts"

  - type: grep
    description: describe でテストがグループ化されている
    pattern: "describe\("
    file: "{tmpdir}/src/utils/password.test.ts"

  - type: grep
    description: テスト命名規則に従っている（should / renders 等）
    pattern: "should |it\("
    file: "{tmpdir}/src/utils/password.test.ts"

  - type: grep
    description: 正常系（valid: true）をテストしている
    pattern: "valid.*true|toBe\(true\)"
    file: "{tmpdir}/src/utils/password.test.ts"

  - type: grep
    description: 8文字の境界値をテストしている
    pattern: "8文字|length.*8|8.*char"
    file: "{tmpdir}/src/utils/password.test.ts"

  - type: llm_judge
    description: 正常系・異常系・境界値が揃っている
    check: テストに正常系（すべての条件を満たすパスワード）・異常系（各バリデーション違反）・境界値（7文字・8文字）が含まれているか
